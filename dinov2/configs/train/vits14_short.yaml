# this corresponds to the default config
train:
  batch_size_per_gpu: 32
  dataset_path: ImageNet:split=TRAIN
  OFFICIAL_EPOCH_LENGTH: 8512
student:
  arch: vit_small
  patch_size: 14
  drop_path_rate: 0
  # drop_path_uniform: false
  block_chunks: 4
  pretrained_weights: './pretrain/dinov2_vits14_pretrain.pth'
optim:
  epochs: 50
  warmup_epochs: 5
  base_lr: 1.0e-04
  min_lr: 1.0e-06
teacher:
  warmup_teacher_temp_epochs: 15
crops:
  global_crops_size: 518
  local_crops_size: 196
